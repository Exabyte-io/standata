isDefault: true
monitors:
  - name: standard_output
  - name: jupyter_notebook_endpoint
results: []
flavors:
  # Each flavor is one requirements.txt — the unit's whole Python environment, installed before
  # the server starts. `notebook` is always pinned alongside `jupyterlab` because rupy launches
  # the unit with `jupyter notebook`, not `jupyter lab`.
  # supportedApplicationVersions is what ties a flavor to a version line.
  notebook_v4.6.0:
    description: JupyterLab 4.6 and notebook 7, nothing else.
    isDefault: true
    supportedApplicationVersions: "~4.6"
    input:
      - name: requirements.txt
        templateName: requirements_v4.6.0.txt
    monitors:
      - name: standard_output
      - name: jupyter_notebook_endpoint
    applicationName: jupyterLab
    executableName: jupyter

  notebook_v4.3.0:
    description: JupyterLab 4.3 and notebook 7, nothing else.
    isDefault: true
    supportedApplicationVersions: "~4.3"
    input:
      - name: requirements.txt
        templateName: requirements_v4.3.0.txt
    monitors:
      - name: standard_output
      - name: jupyter_notebook_endpoint
    applicationName: jupyterLab
    executableName: jupyter

  notebook_v4.6.0_mat3ra_pkgs:
    description: >-
      JupyterLab 4.6 plus the packages the api-examples notebooks import, so they run without a
      pip install first: mat3ra api-client, made[tools], standata and notebooks-utils, with ase,
      numpy, pandas, matplotlib, plotly and ipywidgets.
    supportedApplicationVersions: "~4.6"
    input:
      - name: requirements.txt
        templateName: requirements_v4.6.0_mat3ra_pkgs.txt
    monitors:
      - name: standard_output
      - name: jupyter_notebook_endpoint
    applicationName: jupyterLab
    executableName: jupyter
